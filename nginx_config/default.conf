server {
  listen 80;
  root /var/www/html;
  index index.html;

  # Nuxt's `nuxi generate` pre-renders one index.html per route
  # (e.g. /about/index.html) plus a dedicated 404.html — unlike a
  # client-only SPA, unmatched routes must not fall back to the
  # homepage.
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }
}
